<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam IDE</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>

{% if problem %}
<script>
    window.API_URLS = {
        runCode: "{{ url_for('student.run_code') }}",
        submitCode: "{{ url_for('student.submit') }}",
        getStrikes: "{{ url_for('student.get_strikes') }}",
        logStrike: "{{ url_for('student.log_strike') }}"
    };
</script>
{% endif %}
</head>

<body>

<nav class="navbar navbar-light bg-white px-4 py-2 border-bottom">
	<div class="d-flex align-items-center">
		<h5 class="fw-bold text-primary m-0">PCLP IDE</h5>

		{% if problem %}
		<span class="badge bg-light border text-primary ms-3">
            Question {{ current_num }} / {{ total }}
        </span>
		{% endif %}
	</div>
	<div>
		<button onclick="enforceFullscreen()" class="btn btn-warning btn-sm">Fullscreen</button>
		<a href="{{ url_for('auth.logout') }}" onclick="window.__intentionalNav = true;" class="btn btn-danger btn-sm">Logout</a>
	</div>
</nav>

{% if problem %}
<div id="start-code-template" style="display: none;">{{ problem.start_code }}</div>
<div class="container-fluid main-container">
	<div class="row h-100">

		<div class="col-lg-4 left-panel">
			<div class="description-scroll">

				<h5 class="fw-bold">{{ problem.title }}</h5>
				<span class="badge bg-primary mb-3">{{ problem.weight }} pts</span>

				<script id="raw-markdown" type="text/plain">{{ problem.description | safe }}</script>
				<div id="markdown-output" class="markdown"></div>

			</div>
		</div>

		<div class="col-lg-8 right-panel">

			<div class="editor-section">
				<div id="editor"></div>
			</div>

			<div class="action-bar">
				<div>
					<button onclick="runCode({{ problem.id }})" class="btn btn-outline-primary btn-sm">
						▶ Run Tests
					</button>
					<button onclick="submitExam({{ problem.id }})" class="btn btn-success btn-sm">
						Submit
					</button>
				</div>
				<span class="text-muted small">Python 3</span>
			</div>

			<div id="terminal" class="terminal">
				$ Ready.
			</div>

		</div>

	</div>
</div>
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const raw = document.getElementById("raw-markdown")?.textContent.trim();
if (raw) {
    document.getElementById("markdown-output").innerHTML = marked.parse(raw);
}
</script>

{% if problem %}
<script src="{{ url_for('static', filename='js/anticheat.js') }}"></script>
<script src="{{ url_for('static', filename='js/ide.js') }}"></script>
{% endif %}

</body>
</html>
